<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WhatsApp Button</title>
    <style>
        :root {
            --verde-whatsapp: #25d366;
            --verde-whatsapp-hover: #128c7e;
            --blanco: #ffffff;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background: #f0f0f0;
        }
        
        .btn-whatsapp-hero {
            background: var(--verde-whatsapp);
            color: var(--blanco);
            padding: 18px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp-hero:hover {
            background: var(--verde-whatsapp-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp-hero i {
            font-size: 1.3rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h1>Test del Botón WhatsApp</h1>
    
    <a href="https://wa.me/573112617515?text=Hola,%20quiero%20agendar%20una%20cita" target="_blank" class="btn-whatsapp-hero">
        <i class="fab fa-whatsapp"></i>
        Agenda tu cita por WhatsApp
    </a>
    
    <p>Si el botón se ve correctamente aquí, el problema está en el CSS principal.</p>
</body>
</html>
