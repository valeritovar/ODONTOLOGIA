<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Images</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        img { max-width: 300px; margin: 10px; border: 2px solid #ccc; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Prueba de Imágenes Odontológicas</h1>
    
    <div class="test-section">
        <h2>Hero Image</h2>
        <img src="images/hero-dentist.jpg" alt="Dentista profesional">
        <p>Ruta: images/hero-dentist.jpg</p>
    </div>
    
    <div class="test-section">
        <h2>Clinic Image</h2>
        <img src="images/clinic-moderna.jpg" alt="Clínica dental moderna">
        <p>Ruta: images/clinic-moderna.jpg</p>
    </div>
    
    <div class="test-section">
        <h2>Estado de los archivos</h2>
        <p>Abre la consola del navegador (F12) para ver si hay errores de carga de imágenes.</p>
    </div>
</body>
</html>
